server:
  port: 8087

spring:
  application:
    name: admin-service
  thymeleaf:
    cache: false

app:
  user-service-url: ${USER_SERVICE_URL:http://127.0.0.1:8081}
  catalog-service-url: ${CATALOG_SERVICE_URL:http://127.0.0.1:8082}
  order-service-url: ${ORDER_SERVICE_URL:http://127.0.0.1:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
