<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main class="admin-main">
    <div th:replace="~{fragments :: flashes}"></div>
    <div class="card">
        <div class="toolbar">
            <div>
                <h1 style="margin:0 0 0.25rem">Products</h1>
                <p class="muted" style="margin:0" th:text="${totalElements} + ' total'">0 total</p>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/products/new}">Add product</a>
        </div>

        <form class="search-form" th:action="@{/admin/products}" method="get">
            <input type="search" name="q" placeholder="Search products" th:value="${q}">
            <button type="submit" class="btn">Search</button>
        </form>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td>
                    <strong th:text="${product.name}">Name</strong>
                    <div class="muted" th:text="${product.slug}">slug</div>
                </td>
                <td th:text="${product.categoryName}">Category</td>
                <td th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">0</td>
                <td th:text="${product.stock}">0</td>
                <td>
                    <span th:class="${product.active} ? 'badge badge-active' : 'badge badge-inactive'"
                          th:text="${product.active} ? 'Active' : 'Inactive'">Active</span>
                </td>
                <td>
                    <div class="actions">
                        <a class="btn" th:href="@{/admin/products/{id}/edit(id=${product.id})}">Edit</a>
                        <form th:if="${product.active}" th:action="@{/admin/products/{id}/deactivate(id=${product.id})}" method="post">
                            <button type="submit" class="btn btn-danger">Deactivate</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${totalPages > 1}">
            <a class="btn" th:if="${page > 0}" th:href="@{/admin/products(page=${page - 1}, q=${q})}">Previous</a>
            <span class="muted" th:text="'Page ' + (${page} + 1) + ' of ' + ${totalPages}">Page 1</span>
            <a class="btn" th:if="${page + 1 < totalPages}" th:href="@{/admin/products(page=${page + 1}, q=${q})}">Next</a>
        </div>
    </div>
</main>
</body>
</html>
