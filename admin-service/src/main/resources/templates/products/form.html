<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${editMode} ? 'Edit product' : 'New product')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main class="admin-main">
    <div th:replace="~{fragments :: flashes}"></div>
    <div class="card">
        <h1 th:text="${editMode} ? 'Edit product' : 'New product'">Product</h1>
        <form class="form-grid"
              th:action="${editMode} ? @{/admin/products/{id}/edit(id=${productId})} : @{/admin/products/new}"
              th:object="${form}"
              method="post">
            <div>
                <label for="categoryId">Category</label>
                <select id="categoryId" th:field="*{categoryId}" required>
                    <option value="">Select category</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}">Category</option>
                </select>
            </div>
            <div>
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" required>
            </div>
            <div>
                <label for="slug">Slug</label>
                <input id="slug" type="text" th:field="*{slug}" placeholder="Auto-generated if blank">
            </div>
            <div>
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" required></textarea>
            </div>
            <div>
                <label for="price">Price</label>
                <input id="price" type="number" step="0.01" min="0.01" th:field="*{price}" required>
            </div>
            <div>
                <label for="compareAtPrice">Compare at price</label>
                <input id="compareAtPrice" type="number" step="0.01" min="0" th:field="*{compareAtPrice}">
            </div>
            <div>
                <label for="stock">Stock</label>
                <input id="stock" type="number" min="0" th:field="*{stock}" required>
            </div>
            <div>
                <label for="imageUrl">Image URL</label>
                <input id="imageUrl" type="url" th:field="*{imageUrl}">
            </div>
            <div th:if="${editMode}">
                <label>
                    <input type="checkbox" th:field="*{active}">
                    Active
                </label>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary" th:text="${editMode} ? 'Save changes' : 'Create product'">Save</button>
                <a class="btn" th:href="@{/admin/products}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
