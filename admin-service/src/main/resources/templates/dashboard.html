<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Admin</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f8fafc; color: #0f172a; }
        .card { background: white; border-radius: 12px; padding: 2rem; max-width: 640px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        h1 { margin-top: 0; }
        .muted { color: #64748b; }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${title}">Ecommerce Admin</h1>
    <p class="muted" th:text="${phase}">Scaffold placeholder</p>
    <ul>
        <li>Products — Phase 2</li>
        <li>Orders — Phase 4</li>
        <li>Users — Phase 5</li>
    </ul>
</div>
</body>
</html>
