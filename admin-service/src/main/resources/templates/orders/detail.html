<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order detail')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main class="admin-main">
    <div th:replace="~{fragments :: flashes}"></div>
    <div class="card">
        <div class="toolbar">
            <div>
                <h1 style="margin:0 0 0.25rem" th:text="'Order #' + ${order.id}">Order #1</h1>
                <p class="muted" style="margin:0">
                    User <span th:text="${order.userId}">1</span>
                    · <span th:text="${#strings.substring(order.createdAt, 0, 16)}">2026-01-01</span>
                </p>
            </div>
            <a class="btn" th:href="@{/admin/orders}">Back to orders</a>
        </div>

        <div class="detail-grid">
            <section>
                <h2>Summary</h2>
                <p><span class="muted">Status</span>
                    <span class="badge" th:classappend="' badge-' + ${#strings.toLowerCase(order.status)}"
                          th:text="${order.status}">PAID</span>
                </p>
                <p><span class="muted">Total</span>
                    <strong th:text="${#numbers.formatDecimal(order.subtotal, 1, 'COMMA', 2, 'POINT')}">0</strong>
                </p>
                <p><span class="muted">Ship to</span> <span th:text="${order.shippingAddress}">Address</span></p>

                <form class="status-form" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                    <label for="status">Update status</label>
                    <div class="actions">
                        <select id="status" name="status">
                            <option th:each="item : ${statuses}"
                                    th:value="${item}"
                                    th:text="${item}"
                                    th:selected="${item == order.status}">PAID</option>
                        </select>
                        <button type="submit" class="btn btn-primary">Save status</button>
                    </div>
                </form>
            </section>

            <section>
                <h2>Items</h2>
                <table>
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Line total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.productName}">Product</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="${#numbers.formatDecimal(item.price, 1, 'COMMA', 2, 'POINT')}">0</td>
                        <td th:text="${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}">0</td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </div>
</main>
</body>
</html>
