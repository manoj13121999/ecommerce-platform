<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login · ShopVault</title>
    <link rel="stylesheet" th:href="@{/admin.css}" href="/admin.css">
</head>
<body class="login-page">
<div class="card login-card">
    <h1>ShopVault Admin</h1>
    <p class="muted">Sign in with an admin account.</p>
    <div th:if="${error}" class="flash error" th:text="${error}"></div>
    <form th:action="@{/admin/login}" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="admin@shopvault.local">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required placeholder="password123">
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</div>
</body>
</html>
