server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${PAYMENT_DB_HOST:127.0.0.1}:${PAYMENT_DB_PORT:3310}/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PAYMENT_DB_USER:ecommerce}
    password: ${PAYMENT_DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-for-local-dev-only!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info
